name: Build and Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from colliding
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.1.11'  # Set to match your local `pandoc --version`

      - name: Install Node Dependencies
        run: |
          npm install -g pagefind

      - name: Install Python Dependencies
        run: |
          pip install pyyaml

      - name: Execute Build Pipeline
        run: python build/build_site.py

      # If pagefind is NOT called inside your Python script,
      # uncomment the lines below to index the dist folder:
      # - name: Run Pagefind
      #   run: pagefind --site dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
